<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="solar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle ring decoration -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <g filter="url(#shadow)">
    <!-- Golden Sun rising behind solar panel -->
    <circle cx="256" cy="180" r="70" fill="url(#sun)"/>
    
    <!-- Sun rays -->
    <path d="M 256 75 L 256 95" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
    <path d="M 180 104 L 194 118" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
    <path d="M 332 104 L 318 118" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
    <path d="M 145 180 L 165 180" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
    <path d="M 367 180 L 347 180" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>

    <!-- Angled Solar PV Panel Grid -->
    <!-- Perspective panel outline -->
    <polygon points="120,380 155,245 357,245 392,380" fill="#0f172a" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Panel cells (solar blue) -->
    <!-- Row 1 -->
    <polygon points="160,253 218,253 213,285 151,285" fill="url(#solar)"/>
    <polygon points="226,253 286,253 286,285 221,285" fill="url(#solar)"/>
    <polygon points="294,253 352,253 361,285 294,285" fill="url(#solar)"/>

    <!-- Row 2 -->
    <polygon points="149,292 212,292 206,328 138,328" fill="url(#solar)"/>
    <polygon points="220,292 286,292 286,328 214,328" fill="url(#solar)"/>
    <polygon points="294,292 363,292 374,328 294,328" fill="url(#solar)"/>

    <!-- Row 3 -->
    <polygon points="136,335 204,335 197,372 125,372" fill="url(#solar)"/>
    <polygon points="212,335 286,335 286,372 206,372" fill="url(#solar)"/>
    <polygon points="294,335 376,335 387,372 294,372" fill="url(#solar)"/>

    <!-- Bold lightning bolt (energy) -->
    <polygon points="275,190 235,270 262,270 240,340 288,255 260,255" fill="#fef08a" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Brand text badge -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">ECHONIX</text>
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#5eead4" text-anchor="middle" letter-spacing="2">FIELD SALES CRM</text>
</svg>